apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmu.postgresSecretName" . }}
  labels:
    {{- include "openmu.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  # OpenMU only rewrites the postgres superuser connection via these names.
  DB_ADMIN_USER: {{ .Values.postgres.auth.username | quote }}
  DB_ADMIN_PW: {{ .Values.postgres.auth.password | quote }}
