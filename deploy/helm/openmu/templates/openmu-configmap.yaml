apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmu.configMapName" . }}
  labels:
    {{- include "openmu.labels" . | nindent 4 }}
    app.kubernetes.io/component: openmu
data:
  SERVER_NAME: {{ .Values.serverName | quote }}
  ASPNETCORE_URLS: "http://+:{{ .Values.ports.admin }}"
  ASPNETCORE_ENVIRONMENT: Production
  DB_HOST: {{ include "openmu.postgresName" . | quote }}
  Database__AssumeExternallyProvisioned: {{ .Values.assumeExternallyProvisioned | quote }}
  DOTNET_EnableDiagnostics: "0"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  {{- if .Values.openmu.gcHeapHardLimit }}
  DOTNET_GCHeapHardLimit: {{ .Values.openmu.gcHeapHardLimit | quote }}
  {{- end }}
  {{- if .Values.resolveIP }}
  RESOLVE_IP: {{ .Values.resolveIP | quote }}
  {{- end }}
