# Overlay for the shared kubeadm lab test-01.k8s.t-h.cloud
# (1 CP 4CPU/3.8Gi + 3 workers; Calico; NO StorageClass).
#
#   helm install openmu deploy/helm/openmu -n openmu-lab --create-namespace \
#     -f deploy/helm/openmu/values-lab.yaml
#
# Allocatable RAM: worker-02 ~2.8Gi, worker-01/03 ~1.16Gi. Pin OpenMU (~1Gi RSS)
# on worker-02. Postgres hostPath on worker-03. Keep off the tainted CP.
# InternalIPs are the public addresses; empty resolveIP → Custom = hostIP.
#
# Connect: 45.146.123.74:44405 (original) / :44406 (OSS)

serverName: Lab
resolveIP: ""

openmu:
  persistence:
    adminKeys:
      type: emptyDir
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1280Mi
  nodeSelector:
    kubernetes.io/hostname: lin-worker-02

postgres:
  persistence:
    type: hostPath
    hostPath: /var/lib/openmu-lab/postgres
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 384Mi
  nodeSelector:
    kubernetes.io/hostname: lin-worker-03
