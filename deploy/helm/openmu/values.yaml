# Shared kubeadm lab defaults: one tenant, 1 replica, dedicated namespace.
# Total *requests* ≈ 75m CPU / 320Mi. OpenMU limit ~1.25Gi matches Phase 1 RSS.
# No StorageClass: postgres uses hostPath, admin keys emptyDir.
# Do not install cluster-wide operators. Dapr off.

serverName: Lab

# Advertised address the game client uses after server selection.
# Empty = node's hostIP (Custom resolver; disables DB/ipify reconfigure).
# Do not use "local" (Pod IP) or "public" (ipify hangs / wrong NAT address).
resolveIP: ""

image:
  repository: munique/openmu
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

admin:
  username: admin
  password: openmu
  totpSecret: ""

gameVersion: season6

# Pre-created POSTGRES_DB=openmu; skip DROP/CREATE DATABASE. Migrations still
# CREATE ROLE config/account/friend/guild (needs the postgres superuser).
assumeExternallyProvisioned: true

postgres:
  image:
    repository: postgres
    # Pin a major; compose's unpinned "postgres" floated to 18.6 in Phase 1.
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: admin
    database: openmu
  persistence:
    # hostPath | emptyDir | pvc  (this lab has no StorageClass)
    type: hostPath
    hostPath: /var/lib/openmu-lab/postgres
    size: 1Gi
    storageClass: ""
  extraArgs:
    - -c
    - shared_buffers=16MB
    - -c
    - max_connections=20
    - -c
    - work_mem=1MB
    - -c
    - maintenance_work_mem=16MB
    - -c
    - effective_cache_size=64MB
    - -c
    - wal_buffers=4MB
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 384Mi
  podSecurityContext:
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}

openmu:
  persistence:
    adminKeys:
      type: emptyDir # emptyDir | hostPath | pvc
      hostPath: /var/lib/openmu-lab/admin-keys
      size: 32Mi
      storageClass: ""
  # Phase 1 all-in-one ~1Gi RSS; cap GC under the container limit.
  gcHeapHardLimit: "805306368" # 768 MiB
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1280Mi
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

ports:
  admin: 8080
  connect: 44405
  connectOpenSource: 44406
  chat: 55980
  # Fresh Season 6 init listens on 55901–55903; 55904–55906 exist when more game servers are installed.
  game:
    - 55901
    - 55902
    - 55903
    - 55904
    - 55905
    - 55906

service:
  # Player ports: hostPort on the node so 44405/55901/… match the OpenMU database
  # without expanding the cluster NodePort range (30000–32767 by default).
  hostPort: true
  type: ClusterIP
  admin:
    type: NodePort
    nodePort: 30080
  nodePorts:
    connect: 30405
    connectOpenSource: 30406
    chat: 30980
    game:
      - 30901
      - 30902
      - 30903
      - 30904
      - 30905
      - 30906

# OpenMU does not currently speak UDP.
udpPorts: []

namespace:
  create: false
  name: ""

dapr:
  enabled: false

ingress:
  enabled: false
  className: ""
  hosts:
    - host: openmu.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  startup:
    periodSeconds: 10
    failureThreshold: 90 # 15 min — first-time Season 6 seed on a small VM
  readiness:
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    periodSeconds: 30
    failureThreshold: 4

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
serviceAccount:
  create: false
  name: ""
  automount: false
